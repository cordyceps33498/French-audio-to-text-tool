name: Feature request
description: 提出功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的使用场景/问题
      description: 请描述实际场景，而不只是“加一个功能”
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 是否愿意提交 PR
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 该功能不需要把音频/字幕上传到服务器
          required: true
