name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: 语法检查
        shell: pwsh
        run: python -m compileall -q src tests scripts

      - name: 仓库合规检查（密钥/大文件/敏感目录）
        shell: pwsh
        run: python scripts/check_repo.py

      - name: 单元测试
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 依赖一致性检查
        shell: pwsh
        run: python -m pip check
